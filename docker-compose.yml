# =============================================================================
# Lab 2 stack: MLflow tracking server + Airflow (Postgres-backed)
# DDM501
#
# Compose V2 needs no `version:` key.
#
#   docker compose up -d mlflow          # tracking only, enough for most of the lab
#   docker compose up -d                 # the whole stack including Airflow
#
#   MLflow   http://localhost:5000
#   Airflow  http://localhost:8080  (airflow / airflow)
#
# =============================================================================
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # The DAG resolves `pipeline` from here.
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    # Inside the compose network the tracking server is reachable by service name.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PIPELINE_RUN_DIR: /opt/airflow/artifacts
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./pipeline:/opt/airflow/project/pipeline
    - ./data:/opt/airflow/project/data
    # pipeline/config.py creates models/ and artifacts/ under the project root at
    # import time; /opt/airflow/project is root-owned, so mount them writable.
    - ./models:/opt/airflow/project/models
    - ./artifacts:/opt/airflow/project/artifacts
    - ./artifacts:/opt/airflow/artifacts
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # MLflow tracking server + model registry
  # ---------------------------------------------------------------------------
  # MLflow tracking server (sqlite backend on a named volume).
  #
  # Requirements:
  #   image        ghcr.io/mlflow/mlflow:v2.19.0
  #   ports        5000 -> 5000
  #   volumes      the named volume mlflow_data mounted at /mlflow
  #   command      mlflow server
  #                  --backend-store-uri sqlite:////mlflow/mlflow.db
  #                  --default-artifact-root /mlflow/artifacts
  #                  --host 0.0.0.0 --port 5000
  #   healthcheck  hit /health, every 15s, 10s timeout, 5 retries,
  #                20s start_period
  #   restart      unless-stopped
  #
  # Note the FOUR slashes in sqlite:////mlflow/mlflow.db. Three is a relative
  # path, four is absolute. With three, the database lands wherever the process
  # happens to start and disappears on the next restart, taking your entire
  # experiment history with it.
  #
  # --host 0.0.0.0 for the same reason as Lab 1: bound to localhost inside the
  # container, nothing outside can reach it.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: ddm501-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    # Artifacts are proxied through the server (mlflow-artifacts:/) and stored on
    # the volume. A plain --default-artifact-root /mlflow/artifacts would make
    # every client (Airflow, the host) write to ITS OWN local /mlflow/artifacts,
    # and registered models would point at files the server never received.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow metadata database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ddm501-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot: migrate the metadata DB and create the admin user
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: ddm501-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ddm501-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: ddm501-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mlflow_data:
  postgres_data:
